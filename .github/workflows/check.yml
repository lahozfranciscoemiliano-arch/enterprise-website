name: Revisar sitio

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Links, recursos, CSP y llaves
        run: node scripts/check.mjs
      - name: Sintaxis de contact.php
        run: php -l public/contact.php
